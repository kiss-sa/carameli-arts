{{ define "main" }}
{{ partial "title.html" . }}
<section class="about-page">
    {{ if .Params.image }}
    <div class="about-content">
        <div class="about-image">
            <img src="{{ .Params.image }}" alt="About Image" />
        </div>
        <div class="about-text">
            {{ .Content }}
        </div>
    </div>
    {{ else }}
    <section class="prose">
        {{ .Content }}
    </section>
    {{ end }}
</section>

<style>
    .about-page {
        display: flex;
        flex-direction: column;
        max-width: 1200px;
    }

    .about-content {
        display: flex;
        flex-direction: row;
        gap: 10%;
    }

    .about-image img {
        max-width: 350px;
        margin-top: 3rem;
    }

    .about-text {
        flex: 1;
        font-size: 1rem;
        line-height: 1.75;
        margin-left: 20;
        margin-bottom: 20px;
    }

    @media screen and (max-width: 768px) {
        .about-content {
            gap: 5%;
            flex-direction: column;
        }

        .about-image {
            margin-bottom: 20px;
        }
    }
</style>
{{ end }}
